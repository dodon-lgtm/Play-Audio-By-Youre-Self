<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Eternal Abyss</title>
  <link rel="manifest" href="./manifest.json" />
</head>

<body>
  <div class="app-shell">
    <!-- SIDEBAR / NAV -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img src="./assets/icons/logoAS.png" alt="Eternal Abyss" class="h-full w-full object-cover" />
        </div>
        <div class="brand-text">
          <div class="brand-title">Music</div>
          <div class="brand-sub">Eternal Abyss</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item is-active" data-route="home">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-route="search">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
          <span class="nav-label">Cari</span>
        </button>
        <button class="nav-item" data-route="collection">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
          <span class="nav-label">Koleksi Saya</span>
        </button>
        <button class="nav-item" data-route="favorites">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
          <span class="nav-label">Favorit</span>
        </button>
        <button class="nav-item" data-route="playlists">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg></span>
          <span class="nav-label">Playlist</span>
        </button>
        <button class="nav-item" data-route="settings">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>
          <span class="nav-label">Pengaturan</span>
        </button>
        <div class="nav-divider"></div>

        <input id="filePicker" class="file-input" type="file" multiple
          accept="audio/mpeg,audio/wav,audio/ogg,.mp3,.wav,.opus" hidden />
        <button class="nav-item nav-primary" id="addAudioBtn" type="button">
          <span class="nav-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>
          <span class="nav-label">Tambah audio</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <!-- <div class="hint">Offline app shell via PWA.</div>
        <div class="hint muted">Audio lokal tetap perlu dipilih ulang setelah refresh.</div> -->
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main" aria-live="polite">
      <button class="hamburger" id="hamburger" type="button" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="page page-animate" id="page">
        <!-- UI injected by ui.js -->
      </div>
    </main>

    <!-- HAMBURGER MENU OVERLAY -->
    <div class="hamburger-overlay" id="hamburgerOverlay">
      <div class="hamburger-menu">
        <button class="menu-close" id="menuClose" type="button" aria-label="Tutup menu"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        <nav class="menu-nav">
          <button class="menu-item" data-route="home">
            <span class="menu-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
            <span>Local Player</span>
          </button>
          <button class="menu-item" data-route="home">
            <span class="menu-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
            <span>Home</span>
          </button>
          <button class="menu-item" data-route="search">
            <span class="menu-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
            <span>Cari</span>
          </button>
          <button class="menu-item" data-route="collection">
            <span class="menu-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
            <span>Koleksi Saya</span>
          </button>
          <button class="menu-item" data-route="favorites">
            <span class="menu-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
            <span>Favorit</span>
          </button>
          <button class="menu-item" data-route="playlists">
            <span class="menu-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg></span>
            <span>Playlist</span>
          </button>
          <button class="menu-item" data-route="settings">
            <span class="menu-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></span>
            <span>Pengaturan</span>
          </button>
          <div class="menu-divider"></div>
          <button class="menu-item menu-primary" id="addAudioBtnMenu" type="button">
            <span class="menu-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>
            <span>Tambah Audio</span>
          </button>
        </nav>
      </div>
    </div>

    <!-- BOTTOM NAV for mobile -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Menu">
      <button class="bottom-item is-active" data-route="home" type="button" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button>
      <button class="bottom-item" data-route="search" type="button" aria-label="Cari"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
      <button class="bottom-item" data-route="collection" type="button" aria-label="Koleksi Saya"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
      <button class="bottom-item" data-route="favorites" type="button" aria-label="Favorit"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
      <button class="bottom-item" data-route="playlists" type="button" aria-label="Playlist"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg></button>
      <button class="bottom-item" data-route="settings" type="button" aria-label="Pengaturan"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="bottom-item bottom-add" id="addAudioBtnMobile" type="button" aria-label="Tambah audio"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    </nav>

    <!-- PLAYER -->
    <section class="player" id="player" aria-label="Player">
      <div class="player-grid">
        <!-- Modal full-screen (mobile): header + tombol tutup -->
        <div class="player-modal-head">
          <span class="player-modal-label">Sedang Diputar</span>
          <button class="btn-icon player-collapse" id="playerCollapse" type="button" aria-label="Tutup player layar penuh">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>

        <!-- Modal full-screen (mobile): album art besar -->
        <div class="player-modal-cover" id="playerModalCover" aria-hidden="true"></div>

        <!-- Modal full-screen (mobile): judul + artis/file key + favorit -->
        <div class="player-modal-meta">
          <div class="player-modal-text">
            <div class="track-title-lg" id="playerModalTitle">Belum ada audio</div>
            <div class="track-sub-lg" id="playerModalSubtitle">—</div>
          </div>
          <button class="btn-icon fav-toggle" id="playerFavorite" type="button" aria-label="Tambah ke favorit" aria-pressed="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </button>
        </div>

        <!-- Mini bar: cover + judul (tap = buka modal full-screen di mobile) -->
        <button class="player-track" id="playerExpand" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Buka player layar penuh">
          <span class="cover" id="playerCover" aria-hidden="true"></span>
          <span class="track-meta">
            <span class="track-title" id="playerTitle">Belum ada audio</span>
            <span class="track-sub" id="playerSubtitle">—</span>
          </span>
          <span class="player-expand-hint" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" focusable="false"><path d="m18 15-6-6-6 6"/></svg>
          </span>
        </button>

        <div class="player-controls">
          <button class="btn-icon" id="btnPrev" type="button" aria-label="Previous"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="icon" focusable="false"><polygon points="19 20 9 12 19 4 19 20"/><rect x="4" y="4" width="2.4" height="16" rx="1.2"/></svg></button>
          <button class="btn-icon btn-play" id="btnPlayPause" type="button" aria-label="Play/Pause"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="icon" focusable="false"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
          <button class="btn-icon" id="btnNext" type="button" aria-label="Next"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="icon" focusable="false"><polygon points="5 4 15 12 5 20 5 4"/><rect x="17.6" y="4" width="2.4" height="16" rx="1.2"/></svg></button>

          <button class="btn-pill" id="btnShuffle" type="button" aria-pressed="false">Shuffle</button>
          <button class="btn-pill" id="btnRepeat" type="button" aria-pressed="false">Repeat: off</button>
        </div>

        <div class="player-progress">
          <div class="progress-top">
            <span class="time" id="currentTime">0:00</span>
            <div class="progress-wrap">
              <input id="progressRange" type="range" min="0" max="1000" value="0" step="1" aria-label="Progress" />
              <div class="progress-bar" aria-hidden="true">
                <div class="progress-fill" id="progressFill"></div>
              </div>
            </div>
            <span class="time" id="durationTime">0:00</span>
          </div>
          <div class="volume-row">
            <span class="volume-label">Vol</span>
            <input id="volumeRange" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="Volume" />
            <span class="volume-value" id="volumeValue">80%</span>
          </div>
        </div>

        <!-- Audio Spectrum / VU Level Meter: strip tipis di bagian bawah player,
             berdekatan dengan baris tombol Repeat/Shuffle. Digambar real-time
             via Web Audio API + requestAnimationFrame (src/ui/visualizer.ts). -->
        <div class="player-viz-row">
          <canvas id="playerVisualizer" class="player-viz" aria-hidden="true"></canvas>
        </div>
      </div>

      <audio id="audio" preload="metadata"></audio>
    </section>
  </div>

  <!-- Entry utama aplikasi (Vite + TypeScript): seluruh app dimuat dari src/main.ts -->
  <script type="module" src="/src/main.ts"></script>

  <noscript>Aktifkan JavaScript untuk menjalankan aplikasi.</noscript>
</body>

</html>
